server {
  listen 3001;
  server_name localhost;

  root /var/www;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # nginx add_header is replace-not-merge: any per-location add_header drops
  # the inherited stack. Keep these blocks free of add_header.

  location = /config.js {
    try_files $uri =404;
  }

  location = /sw.js {
    try_files $uri =404;
  }

  location = /index.html {
  }

  location = /assets/site.webmanifest {
    types { application/manifest+json webmanifest; }
  }

  location ~* \.map$ {
    return 404;
  }

  # Public static files (icons, manifest). Per-location add_header skips the
  # security-header inheritance to keep the Cache-Control.
  location /assets/ {
    add_header Cache-Control "public, max-age=43200";
    try_files $uri =404;
  }

  # Content-hashed bundle output of the current and previous releases, kept on
  # a persistent volume by docker-entrypoint.sh so tabs opened before a deploy
  # can still lazy-load their own build's chunks.
  location /assets/build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Release bookkeeping written by docker-entrypoint.sh.
  location /assets/build/.releases/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
